name: KeyAllZ
version: "3.3.2"
main: dev.infnox.keyAllZ.KeyAllZ
api-version: "1.21"
authors: [luvtoxic]
folia-supported: true
softdepend: [PlaceholderAPI]
commands:
  keyallz:
    description: Main command to manage KeyAll timers
    usage: /<command> <start|stop|loop|remind|list|reload>
    permission: keyallz.admin
    permission-message: "§cYou do not have permission to use KeyAllZ commands."

permissions:
  keyallz.admin:
    description: Allows managing KeyAllZ timers (start, stop, loop, remind, list, reload)
    default: op
  keyallz.use:
    description: Alias for keyallz.admin (backwards compatible)
    default: op
    children:
      keyallz.admin: true
