# KeyAllZ Configuration
# Define your KeyAll events here.
# Each entry supports messages, sounds, commands, and reminders.

# Redis Multi-Server Sync
# Turn this on if you want timers shared across all your servers.
# Commands like start, stop, loop, remind, and reload will run everywhere.
# Player rewards are handled per server (only for players online there).
# Console commands without PLAYER: will only run once across the network.

redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  database: 0

  # Redis Pool Settings
  # Adjust these if you have a very large network (1000+ players)
  pool:
    max-total: 16
    max-idle: 8
    min-idle: 2

  # Prefix used for Redis keys (change if you're using Redis for other stuff too)
  key-prefix: "keyallz"

  # Unique server ID (leave blank to auto assign)
  server-id: ""

keyalls:
  example:
    title: "<green>You received a KeyAll reward!"
    actionbar: "<yellow>Enjoy your free key!"
    chat: "<gray>[KeyAll] <aqua>Congrats %player%, you got a reward!"
    sound: "minecraft:entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.0

    # Commands run as the player receiving the KeyAll
    player-commands:
      - "warp crates"
      - "say I just got a key!"

    # Commands run from console
    # Prefix with PLAYER: to run it for each player individually
    console-commands:
      - "PLAYER: crate key give %player% test 1"

    permission: "keyall.receive.example"

    reminders:
      enabled: true
      interval: 600
      message: "<yellow>Don't forget to claim your KeyAll! Time left: %remaining-time%"


  votekey:
    title: "<gold>Vote Party Reward!"
    actionbar: "<green>You earned a Vote Key!"
    chat: "<gray>[VoteParty] <aqua>%player% got a Vote Key!"
    sound: "minecraft:entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.2

    player-commands:
      - "me Just got a voting key YAY!"
    console-commands:
      - "PLAYER: crate key give %player% vote 1"
    permission: ""

    reminders:
      enabled: false
      interval: 0
      message: ""

  donorkey:
    title: "<light_purple>Donor KeyAll!"
    actionbar: "<yellow>You received a Donor Key!"
    chat: "<gray>[KeyAll] <light_purple>%player% received a Donor Key!"
    sound: "minecraft:ui.toast.challenge_complete"
    sound-volume: 1.0
    sound-pitch: 1.0

    player-commands: []
    console-commands:
      - "PLAYER: crate key give %player% donor 1"
    permission: "keyall.receive.donor"

    reminders:
      enabled: false
      interval: 1200
      message: "<light_purple>Donor KeyAll is available! Time left: %remaining-time%"
